spring:
  application:
    name: soundtouch-radio

soundtouch:
  host: 10.0.0.148
  http-port: 8090
  ws-port: 8080
  connect-timeout: 2s
  read-timeout: 5s

server:
  port: 8080

radio:
  stations:
    - id: vltava
      name: ČRo Vltava
      stream: http://icecast2.rozhlas.cz/vltava-mp3-128
      button: 1
    - id: radiowave
      name: ČRo Radio Wave
      stream: http://icecast2.rozhlas.cz/radiowave-mp3-128
      button: 2
  buttons:
    enabled: false
    debounce: 50ms
    bindings:
      - gpio: 17
        action:
          type: play_station
          station: vltava
      - gpio: 27
        action:
          type: play_station
          station: radiowave
      - gpio: 19
        action:
          type: key
          key: PLAY_PAUSE
      - gpio: 16
        action:
          type: key
          key: VOLUME_UP
      - gpio: 26
        action:
          type: key
          key: VOLUME_DOWN
  display:
    enabled: false
    i2c-controller: 1
    i2c-address: 60     # 0x3C
    height: TALL        # SHORT=32, TALL=64, LARGE=128
    idle-blank-after: 5m
